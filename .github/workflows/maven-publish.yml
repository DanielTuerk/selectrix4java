# This workflow builds the package with Maven and publishes it to Maven Central
# when a GitHub release is created.
#
# Required repository secrets:
#   CENTRAL_TOKEN_USERNAME  - username part of the Central Portal user token
#   CENTRAL_TOKEN_PASSWORD  - password part of the Central Portal user token
#   MAVEN_GPG_PRIVATE_KEY   - ASCII-armored GPG private key used to sign artifacts
#   MAVEN_GPG_PASSPHRASE    - passphrase for the GPG private key

name: Publish to Maven Central

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Publish to Maven Central
      run: mvn -B deploy -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
