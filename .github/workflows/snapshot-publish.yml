# Publishes the current -SNAPSHOT build on every push to master to GitHub Packages, so
# downstream projects (e.g. controlcenter) can depend on unreleased master-branch state
# without needing a local `mvn install`.
#
# No extra secrets required: the built-in GITHUB_TOKEN is granted packages:write below.

name: Publish Snapshot to GitHub Packages

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify project version is a SNAPSHOT
        run: |
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "master pom.xml version '$VERSION' is not a SNAPSHOT - skipping publish (release versions go through maven-publish.yml)."
            exit 1
          fi

      - name: Deploy SNAPSHOT to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
